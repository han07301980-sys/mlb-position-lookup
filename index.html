<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MLB 守備位置查詢</title>
<style>
:root{--bg:#f4f6fa;--ink:#172033;--muted:#68758b;--navy:#101d38;--blue:#315ee8;--line:#e5e9f1;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.hero{background:linear-gradient(120deg,#0e1b35,#1e3a70);color:#fff;padding:36px max(24px,calc((100vw - 1120px)/2)) 30px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:#b8c9f1;font-weight:700}.hero h1{font-size:clamp(27px,4vw,38px);margin:7px 0 5px;letter-spacing:-.03em}.hero p{color:#d2ddf3;margin:0}.wrap{max-width:1120px;margin:26px auto;padding:0 22px}.controls{display:grid;grid-template-columns:1.2fr 1fr 1fr 1.3fr auto;gap:12px;align-items:end;background:var(--card);padding:18px;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 18px #1b2a4410}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px}.field select,.field input{width:100%;height:43px;padding:0 12px;border:1px solid #d9dfeb;border-radius:8px;background:#fff;color:var(--ink);font:inherit;outline:none}.field select:focus,.field input:focus{border-color:#7793f1;box-shadow:0 0 0 3px #315ee81a}.refresh{height:43px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;padding:0 16px;cursor:pointer}.refresh:hover{background:#244dcf}.meta{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 12px;color:var(--muted);font-size:13px}.count{font-weight:700;color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.player{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;display:flex;gap:12px;align-items:center;min-height:84px;box-shadow:0 3px 12px #1b2a4408}.avatar{width:50px;height:50px;border-radius:50%;background:#edf1fc;object-fit:cover;flex:none}.avatar-fallback{display:grid;place-items:center;color:#315ee8;font-weight:800;font-size:17px}.name{font-size:15px;font-weight:750}.sub{margin-top:3px;color:var(--muted);font-size:12px}.flag{width:24px;height:18px;object-fit:cover;vertical-align:middle;border:1px solid #e5e9f1;border-radius:2px}.pos{margin-left:auto;flex:none;padding:5px 9px;background:#edf2ff;color:#2b4fc1;border-radius:7px;font-size:12px;font-weight:800}.state{background:white;border:1px solid var(--line);border-radius:12px;padding:30px;text-align:center;color:var(--muted);grid-column:1/-1}.error{color:#a93232}.foot{color:#8993a5;font-size:12px;margin:22px 2px}.spinner{display:inline-block;width:15px;height:15px;border:2px solid #d9dfeb;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:760px){.controls{grid-template-columns:1fr 1fr}.hero{padding-top:28px}.refresh{width:100%}}@media(max-width:450px){.controls{grid-template-columns:1fr}.meta{align-items:flex-start;gap:8px;flex-direction:column}}
</style></head><body>
<header class="hero"><div class="eyebrow">Major League Baseball</div><h1>MLB 守備位置查詢</h1><p>依球隊、守備位置或球員姓名，快速查詢大聯盟名單。</p></header>
<main class="wrap"><section class="controls" aria-label="查詢條件"><div class="field"><label for="team">球隊</label><select id="team"><option value="">載入球隊中…</option></select></div><div class="field"><label for="position">優先守備位置</label><select id="position"><option value="">所有位置</option><option value="P">投手 P</option><option value="C">捕手 C</option><option value="1B">一壘手 1B</option><option value="2B">二壘手 2B</option><option value="3B">三壘手 3B</option><option value="SS">游擊手 SS</option><option value="LF">左外野手 LF</option><option value="CF">中外野手 CF</option><option value="RF">右外野手 RF</option><option value="OF">外野手 OF</option><option value="DH">指定打擊 DH</option></select></div><div class="field"><label for="secondary">第二守備位置</label><select id="secondary"><option value="">不限</option><option value="N/A">無第二位置（N/A）</option><option value="P">投手 P</option><option value="C">捕手 C</option><option value="1B">一壘手 1B</option><option value="2B">二壘手 2B</option><option value="3B">三壘手 3B</option><option value="SS">游擊手 SS</option><option value="LF">左外野手 LF</option><option value="CF">中外野手 CF</option><option value="RF">右外野手 RF</option><option value="DH">指定打擊 DH</option></select></div><div class="field"><label for="search">球員姓名</label><input id="search" type="search" placeholder="輸入球員姓名"></div><button id="reload" class="refresh">重新載入</button></section>
<div class="meta"><div id="status">正在連線至 MLB 球員資料…</div><div id="total" class="count"></div></div><section id="results" class="grid" aria-live="polite"><div class="state"><span class="spinner"></span>正在讀取大聯盟名單…</div></section><p class="foot">資料來源：MLB Stats API。名單為各隊目前大聯盟球員名單，優先守備位置與守備紀錄依 MLB 登錄資料整理；國旗依 MLB 登錄的出生國家顯示。資料載入時間：<span id="updated">—</span></p></main>
<script>
const API='https://statsapi.mlb.com/api/v1';const teamEl=document.querySelector('#team'),posEl=document.querySelector('#position'),secondaryEl=document.querySelector('#secondary'),searchEl=document.querySelector('#search'),results=document.querySelector('#results'),statusEl=document.querySelector('#status'),totalEl=document.querySelector('#total');let players=[],teams=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function countryCode(country){const aliases={"USA":"us","United States":"us","United States of America":"us","Dominican Republic":"do","Venezuela":"ve","Cuba":"cu","Puerto Rico":"pr","Mexico":"mx","Canada":"ca","Japan":"jp","South Korea":"kr","Korea":"kr","Republic of Korea":"kr","Taiwan":"tw","China":"cn","Colombia":"co","Panama":"pa","Nicaragua":"ni","Honduras":"hn","Brazil":"br","Curacao":"cw","Curaçao":"cw","Aruba":"aw","Netherlands":"nl","The Netherlands":"nl","Australia":"au","Germany":"de","Italy":"it","Spain":"es","France":"fr","Czech Republic":"cz","Czechia":"cz","United Kingdom":"gb","Ireland":"ie","South Africa":"za","Jamaica":"jm","Bahamas":"bs","Trinidad and Tobago":"tt","Belize":"bz","Guatemala":"gt","Argentina":"ar","Peru":"pe"};const key=String(country||'').trim();return aliases[key]||(/^[A-Za-z]{2}$/.test(key)?key.toLowerCase():'')}function posCode(p){return p?.abbreviation||p?.code||''}function render(){const t=teamEl.value,p=posEl.value,s=secondaryEl.value,q=searchEl.value.trim().toLocaleLowerCase();let rows=players.filter(x=>(!t||String(x.teamId)===t)&&(!p||posCode(x.position)===p)&&(!s||(s==='N/A'?!x.secondaryPositions?.length:(x.secondaryPositions||[]).includes(s)))&&(!q||x.fullName.toLocaleLowerCase().includes(q)));totalEl.textContent=`${rows.length} 位球員`;if(!rows.length){results.innerHTML='<div class="state">沒有符合條件的球員，請調整篩選條件。</div>';return}results.innerHTML=rows.map(x=>{const initials=x.fullName.split(/\s+/).map(w=>w[0]).slice(0,2).join('');const img=x.id?`https://img.mlbstatic.com/mlb-photos/image/upload/w_120,q_100/v1/people/${encodeURIComponent(x.id)}/headshot/67/current`:'';const code=countryCode(x.birthCountry);return `<article class="player"><img class="avatar" loading="lazy" src="${img}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'avatar avatar-fallback',textContent:'${esc(initials)}'}))"><div><div class="name">${esc(x.fullName)}</div><div class="sub">${esc(x.teamName)}${x.jerseyNumber?` · #${esc(x.jerseyNumber)}`:''}</div>${code?`<div class="sub"><img class="flag" src="https://flagcdn.com/24x18/${code}.png" srcset="https://flagcdn.com/48x36/${code}.png 2x" alt="${esc(x.birthCountry)}國旗" title="${esc(x.birthCountry)}"></div>`:''}</div><span class="pos">${esc(posCode(x.position)||'—')}</span></article>`}).join('')}
function collectPositions(person){const codes=new Set();for(const stat of person.stats||[])for(const split of stat.splits||[]){const c=split.position?.abbreviation||split.stat?.position?.abbreviation;if(c)codes.add(c)}return [...codes].filter(c=>c!==posCode(person.primaryPosition)).sort((a,b)=>['P','C','1B','2B','3B','SS','LF','CF','RF','DH'].indexOf(a)-['P','C','1B','2B','3B','SS','LF','CF','RF','DH'].indexOf(b))}
async function load(){document.querySelector('#updated').textContent='—';statusEl.innerHTML='<span class="spinner"></span>正在讀取 MLB 名單…';results.innerHTML='<div class="state"><span class="spinner"></span>載入中…</div>';totalEl.textContent='';try{const tr=await fetch(`${API}/teams?sportId=1&activeStatus=Yes`);if(!tr.ok)throw Error('無法取得球隊資料');const tj=await tr.json();teams=(tj.teams||[]).sort((a,b)=>a.name.localeCompare(b.name));teamEl.innerHTML='<option value="">所有球隊</option>'+teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');const settled=await Promise.allSettled(teams.map(async t=>{const r=await fetch(`${API}/teams/${t.id}/roster?rosterType=active`);if(!r.ok)throw Error(t.name);const j=await r.json();return(j.roster||[]).map(x=>({...x.person,position:x.position,jerseyNumber:x.jerseyNumber,teamId:t.id,teamName:t.name}))}));players=settled.flatMap(x=>x.status==='fulfilled'?x.value:[]);const failed=settled.filter(x=>x.status==='rejected').length;const ids=players.map(x=>x.id);for(let i=0;i<ids.length;i+=80){const chunk=ids.slice(i,i+80);try{const url=`${API}/people?personIds=${chunk.join(',')}&hydrate=stats(group=[fielding],type=[yearByYear],sportId=1)`;const res=await fetch(url);if(!res.ok)continue;const data=await res.json();for(const person of data.people||[]){const player=players.find(x=>x.id===person.id);if(player){player.birthCountry=person.birthCountry||'';player.secondaryPositions=collectPositions(person)}}}catch(_){}}players.forEach(x=>x.secondaryPositions??=[]);players.sort((a,b)=>a.teamName.localeCompare(b.teamName)||a.fullName.localeCompare(b.fullName));statusEl.textContent=failed?`資料已載入；${failed} 隊暫時無法取得`:`已載入 ${teams.length} 支 MLB 球隊`;document.querySelector('#updated').textContent=new Date().toLocaleString('zh-TW',{hour12:false});render();if(!players.length)throw Error('目前無法讀取球員名單，請稍後重試。')}catch(e){statusEl.textContent='資料載入失敗';results.innerHTML=`<div class="state error">${esc(e.message||'連線失敗。請確認網路連線後重試。')}<br><br>若此頁以本機檔案開啟時瀏覽器限制資料連線，請改用網頁伺服器開啟。</div>`}}
teamEl.addEventListener('change',render);posEl.addEventListener('change',render);secondaryEl.addEventListener('change',render);searchEl.addEventListener('input',render);document.querySelector('#reload').addEventListener('click',load);load();</script></body></html>
